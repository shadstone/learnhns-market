name: Market performance regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  container-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: market_security_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build production container
        run: docker build -t learnhns-market-ci .

      - name: Run regression suite
        run: docker run --rm learnhns-market-ci python -m unittest discover -s tests -v

      - name: Verify clean database migration
        run: >-
          docker run --rm
          -e DATABASE_URL=sqlite:////tmp/learnhns-migration-test.db
          learnhns-market-ci
          sh -lc 'flask db upgrade && test "$(flask db current | tail -1)" = "9d5a7c1e4b20 (head)"'

      - name: Verify PostgreSQL migrations and concurrent uploads
        run: >-
          docker run --rm --network host
          -e DATABASE_URL=postgresql://postgres:isolated-ci-only@127.0.0.1:5432/market_security_test
          -e TEST_POSTGRES_URL=postgresql://postgres:isolated-ci-only@127.0.0.1:5432/market_security_test
          learnhns-market-ci
          sh -lc 'flask db upgrade && python -m unittest discover -s tests -p test_listing_postgres.py -v'

      - name: Build and smoke-test the local regtest sandbox
        run: |
          docker compose -p market-regtest-ci -f compose.regtest.yaml config --quiet
          docker compose -p market-regtest-ci -f compose.regtest.yaml up --build -d
          python3 scripts/check-regtest-sandbox.py

      - name: Stop local regtest sandbox
        if: always()
        run: docker compose -p market-regtest-ci -f compose.regtest.yaml down --volumes
